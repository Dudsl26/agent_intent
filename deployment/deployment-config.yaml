# Deployment Configuration for Real Estate Lead Qualification Agent
# Update these values with your actual configuration

project:
  id: "your-project-id"
  number: 939932743275
  location: "us-central1"

agent:
  name: "test_for_intents"
  displayName: "Real Estate Lead Qualification Agent"
  defaultLanguage: "he-il"
  timeZone: "Asia/Jerusalem"

dialogflow:
  agent_id: "your-agent-id"
  classification_threshold: 0.3
  model_type: "MODEL_TYPE_ADVANCED"

# Webhook configurations
webhooks:
  playbook_handoff:
    name: "playbookHandoff"
    runtime: "nodejs18"
    entry_point: "playbookHandoff"
    timeout: 60
    memory: "256MB"
    environment_variables:
      PLAYBOOK_API_ENDPOINT: "https://your-playbook-endpoint.com/api/handoff"
      PLAYBOOK_API_KEY: "your_playbook_api_key"
      PROJECT_NAME: "[שם הפרויקט]"
      PROJECT_LOCATION: "[מיקום]"

  whatsapp_integration:
    name: "whatsappWebhook"
    runtime: "nodejs18"
    entry_point: "whatsappWebhook"
    timeout: 30
    memory: "512MB"
    environment_variables:
      TWILIO_ACCOUNT_SID: "your_twilio_sid"
      TWILIO_AUTH_TOKEN: "your_twilio_token"
      DIALOGFLOW_PROJECT_ID: "your-project-id"
      DIALOGFLOW_LOCATION: "us-central1"
      DIALOGFLOW_AGENT_ID: "your-agent-id"

# Twilio configuration
twilio:
  account_sid: "your_twilio_sid"
  auth_token: "your_twilio_token"
  whatsapp_number: "whatsapp:+14155238886"  # Twilio sandbox number
  webhook_url: "https://REGION-PROJECT_ID.cloudfunctions.net/whatsappWebhook"

# Project-specific variables (update in flow responses)
project_variables:
  company_name: "[שם החברה]"
  project_name: "[שם הפרויקט]"
  project_location: "[מיקום]"
  move_in_date: "[תאריך]"
  construction_stage: "[שלב בנייה]"
  prices:
    three_bedroom: "[PRICE_3BR]"
    four_bedroom: "[PRICE_4BR]"
    five_bedroom: "[PRICE_5BR]"

# Testing configuration
testing:
  test_phone: "+972501234567"
  test_session_prefix: "test-session-"

# Monitoring and alerts
monitoring:
  enable_logging: true
  log_level: "INFO"
  bigquery_export:
    enabled: true
    dataset: "dialogflow_conversations"
    table: "conversations"

# Performance targets
targets:
  intent_recognition_rate: 0.85  # 85%
  fallback_rate: 0.15  # 15%
  response_time_ms: 3000  # 3 seconds
  conversation_completion_rate: 0.40  # 40%

# Deployment regions
regions:
  primary: "us-central1"
  backup: "europe-west1"
